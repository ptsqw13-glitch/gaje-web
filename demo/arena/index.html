<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>천하제일 무술대회 (가제)</title>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div id="stage">
  <canvas id="c" width="768" height="432"></canvas>
  <div id="hud">
    <div class="hp"><div id="hpbar"></div><span id="hptxt">100</span></div>
    <div class="hr"><span id="info"></span><button id="blk">외형</button><button id="bm">메뉴</button></div>
  </div>
  <div id="toast"></div>
  <div id="over" hidden><div><b id="otitle">패배</b><p><button id="oagain">다시 하기</button> <button id="omenu">메뉴로</button></p></div></div>
</div>
<div id="pad">
  <div class="grp">
    <button id="bl" class="dir">◀</button>
    <button id="br" class="dir">▶</button>
  </div>
  <div class="grp mid">
    <button id="pickW" class="pick">무기<br><b id="wname">칼</b></button>
    <button id="pickS" class="pick">마법<br><b id="sname">-</b></button>
  </div>
  <div class="grp">
    <button id="bj" class="act">점프</button>
    <button id="ba" class="act red">공격</button>
    <button id="bs" class="act blue">마법</button>
  </div>
</div>
<div id="lookp" hidden>
  <div class="phead"><span>외형 바꾸기</span><button id="lclose">닫기</button></div>
  <div class="lbody">
    <canvas id="lprev" width="144" height="144"></canvas>
    <div class="lside">
      <div class="lrow" id="lsets"></div>
      <div class="lsub">색 (칸을 눌러 고르기)</div>
      <div class="lrow" id="lcolors"></div>
      <div class="lsub">체형</div>
      <div id="lshape"></div>
      <button id="lreset">이 세트 처음 색·체형으로</button>
    </div>
  </div>
</div>
<div id="picker" hidden>
  <div class="phead"><span id="ptitle">무기</span><button id="pclose">닫기</button></div>
  <div id="tabs"></div>
  <div id="plist"></div>
</div>
<div id="menu">
  <div class="mtop">
    <div class="orn"><i></i><span>✦</span><i></i></div>
    <h1>천하제일 무술대회</h1>
    <p class="sub">도트 결투장 (가제)</p>
  </div>
  <div class="mlist">
    <button data-mode="practice">연습 모드<small>허수아비 하나 · 피해 수치 보기</small></button>
    <button data-mode="horde">1 대 100<small>마네킹 백 명이 차례로 몰려온다</small></button>
    <button data-mode="duel">1 대 1<small>나와 같은 상대와 자유 결투</small></button>
    <button data-mode="castle">성 지키기<small>아군 넷을 놓고 소환수 떼를 막는다</small></button>
    <button id="mlook">외형 바꾸기<small>세트 · 색 · 체형</small></button>
  </div>
</div>
<script type="module" src="game/main.js?v=17"></script>
</body>
</html>
