<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2D 화풍 시험</title><style>body{margin:0;background:#14161c;color:#eee;font-family:system-ui,"Noto Sans KR",sans-serif}h1{font-size:18px;margin:14px 14px 4px}p{margin:4px 14px 12px;font-size:13px;color:#b8bcc8;line-height:1.5}a{color:#e9cc84}canvas{display:block;width:100%;max-width:1280px;height:auto;background:#000}#bar{height:4px;background:#333;max-width:1280px}#fill{height:4px;width:0;background:#e9cc84}#msg{margin:8px 14px;font-size:13px;color:#e9cc84}nav{margin:10px 14px;font-size:14px;line-height:2}</style></head><body><h1 id="t"></h1><p><b>pixelfx 도트 효과 시험</b>: 내려찍기 먼지·파편, 발톱 자국, 땅 울림, 각성의 나뭇잎을 pixelfx 효과로 바꿨습니다. 걷기 → 공격 → 특징 → 1차 각성 → 2차 각성 → 특수공격. 화면을 누르면 멈추고, 다시 누르면 이어집니다.</p><canvas id="c" width="640" height="360"></canvas><div id="bar"><div id="fill"></div></div><div id="msg">불러오는 중…</div><nav id="nav"></nav><script>const F=[["D","드루이드","곰 드루이드 브란"],["W","마녀","솥의 마녀 헤스터"],["N","네크로맨서","죽음의 기사 모르드"],["A","악마군","분노의 투사 라스"],["P","성기사단","대성기사 세라피나"],["O","오크","도끼 전사 그록"],["M","돌연변이","촉수 팔 휘감이"],["Y","동양요괴","구미호 여화"],["K","중세기사단","기사단장 레온하르트"]],C={"D":416,"W":418,"N":418,"A":418,"P":418,"O":418,"M":418,"Y":418,"K":418};const f=(new URLSearchParams(location.search).get("f")||"D").toUpperCase();const me=F.find(x=>x[0]===f)||F[0];document.getElementById("t").textContent=me[1]+" — "+me[2];document.title=me[1]+" 2D 화풍 시험";document.getElementById("nav").innerHTML="<a href=\"../f2d/play.html?f=D\">원래 효과로 보기(비교)</a>";const N=C[me[0]],FPS=20,imgs=[],cv=document.getElementById("c"),ctx=cv.getContext("2d"),msg=document.getElementById("msg"),fill=document.getElementById("fill");let loaded=0,playing=true,t0=0,pausedAt=0;for(let i=0;i<N;i++){const im=new Image();im.onload=im.onerror=()=>{loaded++;msg.textContent="불러오는 중… "+Math.round(loaded/N*100)+"%";if(loaded===N){msg.textContent="재생 중 (화면을 누르면 멈춤)";t0=performance.now();requestAnimationFrame(tick);}};im.src="px/f"+String(i).padStart(4,"0")+".jpg";imgs.push(im);}function tick(now){if(playing){const i=Math.floor((now-t0)/1000*FPS)%N;const im=imgs[i];if(im&&im.naturalWidth)ctx.drawImage(im,0,0,640,360);fill.style.width=(i/(N-1)*100)+"%";}requestAnimationFrame(tick);}cv.addEventListener("click",()=>{if(loaded<N)return;if(playing){pausedAt=performance.now()-t0;playing=false;msg.textContent="멈춤 (누르면 이어서)";}else{t0=performance.now()-pausedAt;playing=true;msg.textContent="재생 중 (화면을 누르면 멈춤)";}});</script></body></html>
