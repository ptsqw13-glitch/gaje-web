<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[가제] 입체 무대 시험</title>
<style>
  body { margin: 0; background: #14110f; color: #e8dfcf; font-family: sans-serif; line-height: 1.6; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; color: #f0d890; margin: 8px 0 4px; }
  p { font-size: 14px; color: #c9c0b0; margin: 6px 0 14px; }
  img { width: 100%; height: auto; display: block; border: 2px solid #6a5632; border-radius: 4px; image-rendering: pixelated; margin-bottom: 18px; }
  img.still { image-rendering: auto; }
</style>
</head>
<body>
<main>
  <h1>입체 무대 시험 — 드루이드 「천년숲 · 선돌 고리」</h1>
  <p>움직이는 그림입니다. 브란이 걸어가 내려찍고, 죽음의 기사가 되받아 벱니다. 잠깐 기다리면 재생됩니다(약 9MB).</p>
  <img src="forest.gif" alt="입체 무대에서 캐릭터가 움직이는 그림">
  <p>멈춘 화면(컴퓨터판 화질 그대로).</p>
  <img class="still" src="forest.png" alt="입체 무대 멈춘 화면">
</main>
</body>
</html>
