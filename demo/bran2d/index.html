<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D 화풍 시험 — 브란</title>
<style>
body{margin:0;background:#14161c;color:#eee;font-family:system-ui,"Noto Sans KR",sans-serif}
h1{font-size:18px;margin:14px 14px 4px}p{margin:4px 14px 12px;font-size:13px;color:#b8bcc8;line-height:1.5}
canvas{display:block;width:100%;max-width:1280px;height:auto;background:#000}
#bar{height:4px;background:#333;max-width:1280px}#fill{height:4px;width:0;background:#e9cc84}
#msg{margin:8px 14px;font-size:13px;color:#e9cc84}
</style></head><body>
<h1>2D 화풍 시험 — 곰 드루이드 브란</h1>
<p>Flow로 뽑은 그림을 그대로 살려 움직인 확인용 영상입니다(20초, 되풀이). 화면을 누르면 멈추고, 다시 누르면 이어집니다.<br>걷기 → 공격 → 특징(분노) → 1차 각성 → 2차 각성 → 특수공격</p>
<canvas id="c" width="640" height="360"></canvas>
<div id="bar"><div id="fill"></div></div>
<div id="msg">불러오는 중…</div>
<script>
const N=416, FPS=20, imgs=[], cv=document.getElementById('c'), ctx=cv.getContext('2d');
const msg=document.getElementById('msg'), fill=document.getElementById('fill');
let loaded=0, playing=true, t0=0, pausedAt=0;
function name(i){return 'f/f'+String(i).padStart(4,'0')+'.jpg';}
for(let i=0;i<N;i++){const im=new Image();im.onload=im.onerror=()=>{loaded++;msg.textContent='불러오는 중… '+Math.round(loaded/N*100)+'%';if(loaded===N){msg.textContent='재생 중 (화면을 누르면 멈춤)';t0=performance.now();requestAnimationFrame(tick);}};im.src=name(i);imgs.push(im);}
function draw(i){const im=imgs[i];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,640,360);fill.style.width=(i/(N-1)*100)+'%';}
function tick(now){if(playing){const i=Math.floor((now-t0)/1000*FPS)%N;draw(i);}requestAnimationFrame(tick);}
cv.addEventListener('click',()=>{if(loaded<N)return;if(playing){pausedAt=performance.now()-t0;playing=false;msg.textContent='멈춤 (누르면 이어서)';}else{t0=performance.now()-pausedAt;playing=true;msg.textContent='재생 중 (화면을 누르면 멈춤)';}});
</script>
</body></html>
